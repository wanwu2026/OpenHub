<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenHub 聊天室</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#0f1115; color:#e6e8eb; height:100vh; }
    #login { max-width:420px; margin:12vh auto; background:#171a21; border:1px solid #23262e; border-radius:14px; padding:32px; }
    #login h1 { margin:0 0 8px; font-size:26px; }
    #login p { color:#8b909c; margin:0 0 24px; font-size:14px; }
    #login input { width:100%; margin-bottom:12px; }
    input { background:#0b0d11; border:1px solid #2a2e38; color:#e6e8eb; padding:10px 12px; border-radius:8px; font-size:15px; }
    button { background:#2d7d46; color:#fff; border:0; padding:10px 18px; border-radius:8px; cursor:pointer; font-size:15px; }
    button.secondary { background:#3a4150; }
    #app { display:none; height:100vh; }
    #sidebar { width:300px; float:left; height:100%; background:#141821; border-right:1px solid #23262e; display:flex; flex-direction:column; }
    #sidebar header { padding:16px; border-bottom:1px solid #23262e; display:flex; align-items:center; gap:8px; }
    #sidebar header b { flex:1; }
    #conv-list { flex:1; overflow-y:auto; }
    .conv { padding:14px 16px; border-bottom:1px solid #1e222c; cursor:pointer; }
    .conv:hover, .conv.active { background:#1d2433; }
    .conv .name { font-weight:600; }
    .conv .prev { color:#8b909c; font-size:13px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge { background:#3b82f6; color:#fff; border-radius:10px; padding:1px 7px; font-size:12px; }
    #new-panel { padding:12px; border-top:1px solid #23262e; }
    #new-panel input, #new-panel button { width:100%; margin-bottom:8px; }
    #main { margin-left:300px; height:100%; display:flex; flex-direction:column; }
    #main header { padding:14px 20px; border-bottom:1px solid #23262e; font-size:18px; font-weight:600; }
    #messages { flex:1; overflow-y:auto; padding:20px; }
    .msg { margin-bottom:14px; max-width:70%; }
    .msg.mine { margin-left:auto; text-align:right; }
    .msg .bubble { display:inline-block; background:#232a3a; padding:10px 14px; border-radius:12px; text-align:left; word-break:break-word; }
    .msg.mine .bubble { background:#2d6a4f; }
    .msg .who { font-size:12px; color:#8b909c; margin-bottom:4px; }
    #composer { padding:14px 20px; border-top:1px solid #23262e; display:flex; gap:10px; }
    #composer input { flex:1; }
    .muted { color:#8b909c; font-size:13px; }
    .err { color:#ff8a8a; font-size:14px; min-height:20px; }
  </style>
</head>
<body>
  <div id="login">
    <h1>OpenHub 聊天室</h1>
    <p>注册账号或使用已有账号登录</p>
    <input id="l-user" placeholder="用户名（3-32 字符）">
    <input id="l-pass" type="password" placeholder="密码（至少 6 位）">
    <div class="err" id="l-err"></div>
    <button id="btn-login">登录</button>
    <button id="btn-reg" class="secondary">注册</button>
  </div>

  <div id="app">
    <div id="sidebar">
      <header>
        <b id="me-name">我</b>
        <button id="btn-logout" class="secondary" style="padding:6px 10px">退出</button>
      </header>
      <div id="conv-list"></div>
      <div id="new-panel">
        <input id="n-user" placeholder="对方用户名（开单聊）">
        <button id="btn-direct" style="margin-bottom:14px">发起单聊</button>
        <input id="n-group" placeholder="群名">
        <input id="n-members" placeholder="成员用户名，逗号分隔">
        <button id="btn-group">创建群聊</button>
      </div>
    </div>
    <div id="main">
      <header id="conv-title">选择一个会话</header>
      <div id="messages"><div class="muted">左侧选择会话，或从下方发起单聊/群聊。</div></div>
      <div id="composer">
        <input id="msg-input" placeholder="输入消息，回车发送" disabled>
        <button id="btn-send" disabled>发送</button>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const API = '/api/v1';
    let token = localStorage.getItem('oh_chat_token') || '';
    let me = null, currentConv = null, ws = null;
    const userCache = {};

    function authHeaders() { return {'Authorization':'Bearer ' + token}; }
    function err(el, msg) { el.textContent = msg || ''; }

    async function api(path, opts={}) {
      const r = await fetch(API + path, opts);
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
      return d.data;
    }

    async function doLogin(register) {
      err($('l-err'), '');
      const u = $('l-user').value.trim(), p = $('l-pass').value;
      try {
        if (register) {
          await api('/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p})});
        }
        const d = await api('/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p})});
        token = d.token; localStorage.setItem('oh_chat_token', token);
        await enterApp();
      } catch(e) { err($('l-err'), e.message); }
    }
    $('btn-login').onclick = () => doLogin(false);
    $('btn-reg').onclick = () => doLogin(true);

    async function enterApp() {
      try {
        me = (await api('/auth/me', {headers:authHeaders()})).user;
      } catch(e) { token=''; localStorage.removeItem('oh_chat_token'); return; }
      $('login').style.display='none'; $('app').style.display='block';
      $('me-name').textContent = me.username;
      userCache[me.id] = me.username;
      await loadConvs();
    }

    async function loadConvs() {
      const d = await api('/chat/conversations', {headers:authHeaders()});
      const list = $('conv-list');
      if (!d.conversations.length) { list.innerHTML = '<div class="muted" style="padding:16px">暂无会话</div>'; return; }
      list.innerHTML = d.conversations.map(c => {
        const name = c.type==='group' ? c.name : (c.last_message ? ('与 ' + (userCache[c.last_message.sender_id]||('用户'+c.last_message.sender_id))) : '单聊');
        const prev = c.last_message ? c.last_message.content : '暂无消息';
        return `<div class="conv ${currentConv===c.id?'active':''}" data-id="${c.id}">
          <div class="name">${esc(name)} ${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>
          <div class="prev">${esc(prev)}</div></div>`;
      }).join('');
      list.querySelectorAll('.conv').forEach(el => el.onclick = () => openConv(el.dataset.id));
    }

    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    async function openConv(cid) {
      currentConv = cid;
      $('conv-title').textContent = '会话 ' + cid.slice(0,12);
      $('msg-input').disabled = false; $('btn-send').disabled = false;
      const d = await api('/chat/messages/' + cid, {headers:authHeaders()});
      renderMessages(d.messages);
      if (ws) ws.close();
      const scheme = location.protocol==='https:'?'wss':'ws';
      ws = new WebSocket(`${scheme}://${location.host}${API}/chat/ws/${cid}?token=${encodeURIComponent(token)}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type==='history') renderMessages(m.messages);
        else if (m.type==='message') appendMessage(m);
      };
      await loadConvs();
    }

    function renderMessages(msgs) {
      $('messages').innerHTML = msgs.length ? '' : '<div class="muted">暂无消息</div>';
      msgs.forEach(appendMessage);
    }
    function appendMessage(m) {
      const box = $('messages');
      if (box.querySelector('.muted')) box.innerHTML='';
      const mine = m.sender_id === me.id;
      const div = document.createElement('div');
      div.className = 'msg' + (mine?' mine':'');
      div.innerHTML = `<div class="who">${mine?'我':esc(userCache[m.sender_id]||('用户'+m.sender_id))}</div><div class="bubble">${esc(m.content)}</div>`;
      box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function send() {
      const text = $('msg-input').value.trim();
      if (!text || !currentConv) return;
      if (ws && ws.readyState===1) ws.send(JSON.stringify({kind:'text',content:text}));
      else api('/chat/messages/' + currentConv, {method:'POST', headers:{...authHeaders(),'Content-Type':'application/json'}, body:JSON.stringify({content:text})}).catch(e=>alert(e.message));
      $('msg-input').value='';
    }
    $('btn-send').onclick = send;
    $('msg-input').onkeydown = e => { if(e.key==='Enter') send(); };

    $('btn-logout').onclick = async () => {
      await api('/auth/logout', {method:'POST', headers:authHeaders()}).catch(()=>{});
      token=''; localStorage.removeItem('oh_chat_token'); me=null; currentConv=null;
      if(ws) ws.close();
      $('app').style.display='none'; $('login').style.display='block';
    };

    $('btn-direct').onclick = async () => {
      const name = $('n-user').value.trim();
      if(!name){ alert('请输入对方用户名'); return; }
      try {
        // 用管理接口查 id 不合适（需 admin）；加一个按用户名查 id 的公开接口
        const target = await api('/auth/user-by-name?username=' + encodeURIComponent(name), {headers:authHeaders()});
        userCache[target.id] = target.username;
        const d = await api('/chat/direct', {method:'POST', headers:{...authHeaders(),'Content-Type':'application/json'}, body:JSON.stringify({user_id:target.id})});
        $('n-user').value=''; await loadConvs(); await openConv(d.conv_id);
      } catch(e){ alert(e.message); }
    };

    $('btn-group').onclick = async () => {
      const name = $('n-group').value.trim();
      const names = $('n-members').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!name || !names.length){ alert('请填群名和成员'); return; }
      try {
        const ids = [];
        for(const n of names){ const u = await api('/auth/user-by-name?username='+encodeURIComponent(n), {headers:authHeaders()}); userCache[u.id]=u.username; ids.push(u.id); }
        const d = await api('/chat/groups', {method:'POST', headers:{...authHeaders(),'Content-Type':'application/json'}, body:JSON.stringify({name, member_ids:ids})});
        $('n-group').value=''; $('n-members').value=''; await loadConvs(); await openConv(d.conv_id);
      } catch(e){ alert(e.message); }
    };

    if (token) enterApp();
  </script>
</body>
</html>
